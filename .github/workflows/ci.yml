name: CI

# What a release would stumble on, found at the push: formatting, vet, the
# tests, and the bundle ggui build makes. A change to the documentation or
# the pictures alone runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'assets/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything is built on Linux, the Mac app too: ggui build makes and
  # signs the bundle on any host, and no job waits for a macOS runner.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi
      - name: Vet
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      # The tests lay windows out and draw text offscreen: Mesa gives them
      # a surfaceless context, and a font with the Korean they look for.
      - name: Fonts and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Test
        run: go test -short ./...
      # ggui_debug panics when state is read or written off the goroutine
      # running the frames, as a worker that sets a signal instead of
      # posting it would; the tests' probes arm it as a window does.
      - name: Test off the UI goroutine
        run: go test -tags ggui_debug -short ./...
      - name: Install the ggui command
        run: go install github.com/ironpark/ggui/cmd/ggui@latest
      # A text the code translates that a catalog lacks, or whose format
      # verbs differ, fails here; ggui.toml names the app's tr, trn and
      # ui.T for it.
      - name: Translations
        run: ggui i18n check
      - name: macOS
        run: |
          GOARCH=arm64 ggui build --target macos --dmg
          release/check-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/*.dmg
          retention-days: 7
      # The Windows programs and the Linux packages are built for a release
      # the same way; that they still build is found here, and the Debian
      # package is installed on the system it is for.
      - name: Windows
        env:
          CGO_ENABLED: '0'
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" ggui build --target windows --out "build/windows-$arch"
          done
      - name: Linux
        run: |
          GOARCH=amd64 ggui build --target linux --format tar,deb,rpm --out build/linux
          GOARCH=arm64 ggui build --target linux --format tar --out build/linux-arm64
          sudo apt-get install -y ./build/linux/gvx-desktop_*_amd64.deb
          test -x /usr/bin/gvx-desktop
          test -f /usr/share/applications/io.github.ironpark.gvx-desktop.desktop

  # install.ps1 is what the README tells Windows users to pipe into iex:
  # it is run here as they would, under both PowerShells, against the
  # newest release.
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\GVX Desktop\GVX Desktop.exe")) { throw 'no program was installed' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'GVX Desktop.lnk'))) { throw 'no Start menu shortcut was made' }
      - name: PowerShell 7, over what is there
        shell: pwsh
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\GVX Desktop\GVX Desktop.exe")) { throw 'no program was installed' }

  # A sandbox or docker exec with a terminal runs rungv on a pseudoconsole
  # of the supervisor's own on Windows (internal/sandbox/pty_windows.go),
  # which only a Windows host can try.
  pseudoconsole:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -run 'TestPseudoconsole' -v ./internal/sandbox/
