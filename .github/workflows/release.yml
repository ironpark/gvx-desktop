name: Release

# Builds, verifies, attests, and publishes GVX Desktop releases.
#
# Triggers:
#   - Push of a vX.Y.Z tag: builds all targets, checks bit-for-bit
#     reproducibility, signs SLSA v1.0 build provenance via GitHub Artifact
#     Attestations (actions/attest + Sigstore), publishes the GitHub release
#     atomically, and updates downstream package managers.
#   - Pull request touching release files: executes the full build, test,
#     reproducibility, and packaging pipeline as a read-only dry run without
#     using signing secrets, minting attestations, or publishing.
#   - Manual workflow_dispatch: runs a read-only dry run by default, or
#     rebuilds and uploads Windows and Linux packages for an existing tag that
#     includes release/repro-build.sh when dry_run is false. Rebuilt uploads
#     carry the dispatch ref (for example refs/heads/main) as their OIDC
#     source-ref.
#
# Toolchain versions (Go, ggui CLI, GOPROXY, GOSUMDB, GOAMD64, GOARM64) are
# pinned in release/toolchain.env and driven by release/repro-build.sh so that
# CI and local builds produce identical artifacts.
#
# Optional secrets (used only on real releases, never on PRs or dry runs):
#   TAP_GITHUB_TOKEN     Token with write access to ironpark/homebrew-tap
#   GGUI_P12_BASE64      Base64-encoded Developer ID Application .p12 bundle
#   GGUI_P12_PASSWORD    Password for GGUI_P12_BASE64
#   NOTARY_API_KEY_JSON  App Store Connect API key JSON for Apple notarization
#   CHOCO_API_KEY        chocolatey.org API key (used when CHOCO_PUBLISH=true)
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'release/**'
      - 'ggui.toml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to rebuild (for example v0.8.0). Leave empty for a dry run on this ref.'
        required: false
        type: string
      dry_run:
        description: 'Build and verify without signing, attesting, or publishing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the checkout ref, commit SHA, release metadata, SOURCE_DATE_EPOCH,
  # and pinned toolchain versions from the target revision so every downstream
  # job builds the exact same source and toolchain.
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      app_name: ${{ steps.meta.outputs.app_name }}
      publish_mode: ${{ steps.meta.outputs.publish_mode }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      go_version: ${{ steps.meta.outputs.go_version }}
      ggui_version: ${{ steps.meta.outputs.ggui_version }}
      goproxy: ${{ steps.meta.outputs.goproxy }}
      gosumdb: ${{ steps.meta.outputs.gosumdb }}
      goamd64: ${{ steps.meta.outputs.goamd64 }}
      goarm64: ${{ steps.meta.outputs.goarm64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          publish_mode="dry-run"
          target_tag=""
          commit_sha="$(git rev-parse HEAD)"
          checkout_ref="$commit_sha"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # On pull_request, HEAD is an ephemeral merge commit; downstream
            # jobs check out the PR ref directly to avoid races if main moves.
            checkout_ref="$FULL_REF"
          elif [ "$EVENT_NAME" = "push" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::release tags must match vX.Y.Z (got $REF_NAME)"
              exit 1
            fi
            target_tag="$REF_NAME"
            publish_mode="create"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag must match vX.Y.Z (got $INPUT_TAG)"
              exit 1
            fi
            target_tag="$INPUT_TAG"
            git rev-parse --verify --quiet "refs/tags/$target_tag^{commit}" >/dev/null || {
              echo "::error::tag $target_tag does not exist in this repository"
              exit 1
            }
            commit_sha="$(git rev-parse "refs/tags/$target_tag^{commit}")"
            checkout_ref="$commit_sha"
            git checkout --detach --quiet "$commit_sha"
            if [ "$INPUT_DRY_RUN" != "true" ]; then
              publish_mode="upload"
            fi
          fi

          if [ ! -f release/toolchain.env ] || [ ! -x release/repro-build.sh ]; then
            echo "::error::revision $commit_sha does not include release/toolchain.env and release/repro-build.sh"
            exit 1
          fi
          . ./release/toolchain.env

          field() {
            awk -v key="$1" '
              /^\[app\][[:space:]]*$/ { in_app = 1; next }
              /^\[/ { in_app = 0 }
              in_app && index($0, key " = \"") == 1 {
                sub(/^[^"]*"/, "")
                sub(/"[[:space:]]*$/, "")
                print
                exit
              }
            ' ggui.toml
          }

          configured="$(field version)"
          app_name="$(field name)"
          if [ -z "$configured" ] || [ -z "$app_name" ]; then
            echo "::error::ggui.toml must define [app] name and version"
            exit 1
          fi

          if [ -n "$target_tag" ]; then
            version="${target_tag#v}"
            if [ "$version" != "$configured" ]; then
              echo "::error::tag $target_tag says $version, but ggui.toml says $configured"
              exit 1
            fi
          else
            version="$configured"
            target_tag="dryrun-$configured"
          fi

          epoch="$(git log -1 --format=%ct "$commit_sha")"
          {
            echo "checkout_ref=$checkout_ref"
            echo "commit_sha=$commit_sha"
            echo "tag=$target_tag"
            echo "version=$version"
            echo "app_name=$app_name"
            echo "publish_mode=$publish_mode"
            echo "source_date_epoch=$epoch"
            echo "go_version=$GO_VERSION"
            echo "ggui_version=$GGUI_VERSION"
            echo "goproxy=$GOPROXY"
            echo "gosumdb=$GOSUMDB"
            echo "goamd64=$GOAMD64"
            echo "goarm64=$GOARM64"
          } >> "$GITHUB_OUTPUT"

          echo "commit_sha=$commit_sha checkout_ref=$checkout_ref"
          echo "tag=$target_tag version=$version mode=$publish_mode epoch=$epoch"
          echo "toolchain=go$GO_VERSION ggui=$GGUI_VERSION"

  # Runs unit tests before building release artifacts so broken revisions never
  # reach packaging or attestation.
  test:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.prepare.outputs.go_version }}
      - name: Install offscreen rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Run unit tests
        env:
          GO111MODULE: 'on'
          GOPROXY: ${{ needs.prepare.outputs.goproxy }}
          GOSUMDB: ${{ needs.prepare.outputs.gosumdb }}
          GOTOOLCHAIN: go${{ needs.prepare.outputs.go_version }}
        run: go test -mod=readonly -short ./...

  build-macos:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish_mode != 'upload'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gvx-desktop
    outputs:
      signing: ${{ steps.build.outputs.signing }}
      dmg: ${{ steps.build.outputs.dmg }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      # Check out into gvx-desktop/ so CFBundleExecutable is always gvx-desktop
      # even when run on a fork with a different repository name.
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          path: gvx-desktop
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.prepare.outputs.go_version }}
      - name: Install pinned ggui CLI
        env:
          GGUI_CGO: ${{ needs.prepare.outputs.publish_mode == 'create' && secrets.GGUI_P12_BASE64 != '' && '1' || '0' }}
        run: |
          ./release/repro-build.sh install-ggui "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and verify macOS arm64 bundle and DMG
        id: build
        env:
          PUBLISH_MODE: ${{ needs.prepare.outputs.publish_mode }}
          GGUI_P12_BASE64: ${{ needs.prepare.outputs.publish_mode == 'create' && secrets.GGUI_P12_BASE64 || '' }}
          GGUI_P12_PASSWORD: ${{ needs.prepare.outputs.publish_mode == 'create' && secrets.GGUI_P12_PASSWORD || '' }}
          NOTARY_API_KEY_JSON: ${{ needs.prepare.outputs.publish_mode == 'create' && secrets.NOTARY_API_KEY_JSON || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -eu
          notary_file="$RUNNER_TEMP/notary.json"
          trap 'rm -f "$notary_file"' EXIT

          signing=adhoc
          set --
          if [ "$PUBLISH_MODE" = "create" ] && [ -n "$GGUI_P12_BASE64" ]; then
            signing=identity
            set -- "$@" --identity "Developer ID Application"
            if [ -n "$NOTARY_API_KEY_JSON" ]; then
              (umask 077 && printf '%s' "$NOTARY_API_KEY_JSON" > "$notary_file")
              set -- "$@" --notarize --api-key-file "$notary_file"
            fi
          fi
          ./release/repro-build.sh package macos arm64 "$VERSION" dist "$@"

          exe="dist/$APP_NAME.app/Contents/MacOS/gvx-desktop"
          ./release/repro-build.sh verify-binary "$exe" darwin arm64

          dmg="gvx-desktop-$VERSION-macos-arm64.dmg"
          mkdir -p out
          mv "dist/$dmg" "out/$dmg"
          sha256="$(sha256sum "out/$dmg" | awk '{print $1}')"
          {
            echo "signing=$signing"
            echo "dmg=$dmg"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          ls -lh "out/$dmg"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-arm64
          path: gvx-desktop/out/gvx-desktop-*-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: [prepare, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      amd64: ${{ steps.build.outputs.amd64 }}
      arm64: ${{ steps.build.outputs.arm64 }}
    steps:
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.prepare.outputs.go_version }}
      - name: Install pinned ggui CLI
        run: |
          ./release/repro-build.sh install-ggui "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build Windows zips and verify bit-for-bit reproducibility
        id: build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -eu
          mkdir -p out
          for arch in amd64 arm64; do
            ./release/repro-build.sh package windows "$arch" "$VERSION" "build/$arch"
            ./release/repro-build.sh verify-binary "build/$arch/$APP_NAME.exe" windows "$arch"
            zip="gvx-desktop-$VERSION-windows-$arch.zip"
            cp "build/$arch/$zip" "out/$zip"
            sum="$(sha256sum "out/$zip" | awk '{print $1}')"
            echo "$arch=$sum" >> "$GITHUB_OUTPUT"
          done

          # Rebuild windows/amd64 in a separate output directory with a clean
          # build cache and verify the zip digest matches bit for bit.
          repro_cache="$(mktemp -d)"
          repro_out="$(mktemp -d)"
          trap 'rm -rf "$repro_cache" "$repro_out"' EXIT
          GOCACHE="$repro_cache" ./release/repro-build.sh package windows amd64 "$VERSION" "$repro_out"
          zip_amd64="gvx-desktop-$VERSION-windows-amd64.zip"
          sum_a="$(sha256sum "out/$zip_amd64" | awk '{print $1}')"
          sum_b="$(sha256sum "$repro_out/$zip_amd64" | awk '{print $1}')"
          if [ "$sum_a" != "$sum_b" ]; then
            echo "::error::Windows amd64 zip is not reproducible: $sum_a != $sum_b"
            exit 1
          fi
          echo "Reproducibility verified for $zip_amd64 ($sum_a)"
          ls -lh out/*.zip
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: out/gvx-desktop-*-windows-*.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: [prepare, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.prepare.outputs.go_version }}
      - name: Install pinned ggui CLI
        run: |
          ./release/repro-build.sh install-ggui "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build Linux archives and verify bit-for-bit reproducibility
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -eu
          mkdir -p out
          for arch in amd64 arm64; do
            ./release/repro-build.sh package linux "$arch" "$VERSION" "build/$arch"
            ./release/repro-build.sh verify-binary "build/$arch/gvx-desktop-linux-$arch/usr/bin/gvx-desktop" linux "$arch"
            cp "build/$arch"/*.tar.gz "build/$arch"/*.deb "build/$arch"/*.rpm out/
          done

          # Rebuild linux/amd64 with a fresh Go build cache and verify the
          # standalone binary, tarball, and Debian package match bit for bit.
          # RPM embeds os.Hostname() in RPMTAG_BUILDHOST via nfpm, so cross-host
          # RPM reproducibility awaits upstream ggui support.
          repro_cache="$(mktemp -d)"
          repro_out="$(mktemp -d)"
          trap 'rm -rf "$repro_cache" "$repro_out"' EXIT
          GOCACHE="$repro_cache" ./release/repro-build.sh package linux amd64 "$VERSION" "$repro_out"
          for f in \
            "gvx-desktop-$VERSION-linux-amd64.tar.gz" \
            "gvx-desktop_${VERSION}_amd64.deb"
          do
            sum_a="$(sha256sum "out/$f" | awk '{print $1}')"
            sum_b="$(sha256sum "$repro_out/$f" | awk '{print $1}')"
            if [ "$sum_a" != "$sum_b" ]; then
              echo "::error::Linux artifact $f is not reproducible: $sum_a != $sum_b"
              exit 1
            fi
            echo "Reproducibility verified for $f ($sum_a)"
          done
          ls -lh out/
      - name: Test installing the Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./out/gvx-desktop_*_amd64.deb
          test -x /usr/bin/gvx-desktop
          test -f /usr/share/applications/io.github.ironpark.gvx-desktop.desktop
          dpkg -s gvx-desktop | grep -E '^(Version|Maintainer|Homepage)'
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Read-only verification of assembled release artifacts for pull requests and
  # dry runs. Keeps write permissions, OIDC tokens, and attestations out of
  # unreviewed runs.
  verify-dry-run:
    needs: [prepare, build-macos, build-windows, build-linux]
    if: needs.prepare.outputs.publish_mode == 'dry-run'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate dry-run checksums
        run: |
          set -eu
          (
            cd dist
            LC_ALL=C
            for f in *; do
              [ -f "$f" ] || continue
              sha256sum -- "$f"
            done
          ) > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

  # Collects all built artifacts, writes checksums and transparent build
  # metadata, generates and verifies signed SLSA v1.0 build provenance via
  # Sigstore, and publishes the GitHub release atomically on tag pushes.
  publish:
    needs: [prepare, build-macos, build-windows, build-linux]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish_mode != 'dry-run' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      (needs.build-macos.result == 'success' ||
        (needs.prepare.outputs.publish_mode == 'upload' && needs.build-macos.result == 'skipped'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write checksums and build manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          GO_VERSION: ${{ needs.prepare.outputs.go_version }}
          GGUI_VERSION: ${{ needs.prepare.outputs.ggui_version }}
          GOPROXY: ${{ needs.prepare.outputs.goproxy }}
          GOSUMDB: ${{ needs.prepare.outputs.gosumdb }}
          GOAMD64: ${{ needs.prepare.outputs.goamd64 }}
          GOARM64: ${{ needs.prepare.outputs.goarm64 }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p meta
          (
            cd dist
            LC_ALL=C
            for f in *; do
              [ -f "$f" ] || continue
              sum="$(sha256sum -- "$f")"
              printf '%s\n' "$sum" > "../meta/$f.sha256"
              printf '%s\n' "$sum"
            done
          ) > meta/SHA256SUMS
          test -s meta/SHA256SUMS
          cat meta/SHA256SUMS

          cat > meta/BUILD_INFO.txt <<EOF
          repository=$REPOSITORY
          tag=$TAG
          version=$VERSION
          commit=$COMMIT_SHA
          source_date_epoch=$SOURCE_DATE_EPOCH
          go_version=$GO_VERSION
          ggui_version=$GGUI_VERSION
          goproxy=$GOPROXY
          gosumdb=$GOSUMDB
          goamd64=$GOAMD64
          goarm64=$GOARM64
          workflow_run=$RUN_URL

          # Reproduce release packages from commit $COMMIT_SHA:
          SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ./release/repro-build.sh install-ggui
          SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ./release/repro-build.sh package windows amd64 $VERSION ./out
          SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ./release/repro-build.sh package linux amd64 $VERSION ./out

          # Install a reproducible standalone binary from proxy.golang.org (Linux example):
          GO111MODULE=on GOPROXY=$GOPROXY GOSUMDB=$GOSUMDB GOENV=off GOWORK=off GOTELEMETRY=off GOFIPS140=off GOEXPERIMENT= GODEBUG= GOFLAGS= GOBIN= CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=$GOAMD64 GOTOOLCHAIN=go$GO_VERSION go install -trimpath -pgo=off -compiler=gc -ldflags='-s -w -buildid= -X main.version=$VERSION -X github.com/ironpark/ggui.buildID=io.github.ironpark.gvx-desktop' -- github.com/ironpark/gvx-desktop@v$VERSION
          EOF
          cat meta/BUILD_INFO.txt
      - name: Generate SLSA v1.0 build provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: meta/SHA256SUMS
      - name: Verify SLSA build provenance and stage Sigstore bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PUBLISH_MODE: ${{ needs.prepare.outputs.publish_mode }}
        run: |
          set -eu
          while IFS= read -r line; do
            file="${line#*  }"
            gh attestation verify "dist/$file" \
              --bundle "$BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done < meta/SHA256SUMS
          bundle_name="gvx-desktop-${TAG}.sigstore.json"
          if [ "$PUBLISH_MODE" = "upload" ]; then
            bundle_name="gvx-desktop-${TAG}-rebuilt.sigstore.json"
          fi
          cp "$BUNDLE" "meta/$bundle_name"
      - name: Publish GitHub release
        if: needs.prepare.outputs.publish_mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/* meta/* \
            --verify-tag \
            --title "$APP_NAME $VERSION" \
            --generate-notes \
            --notes "On an Apple silicon Mac (macOS 13 or later), install with \`brew install --cask ironpark/tap/gvx-desktop\`, or open the disk image and drag the app to Applications. On Windows, unzip the program for your PC: amd64 for Intel and AMD, arm64 for Arm. On Linux, install the .deb or .rpm for your CPU, or unpack the tarball. Verify downloads with \`SHA256SUMS\` and SLSA build provenance via \`gh attestation verify <file> --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/release.yml --source-ref refs/tags/$TAG --deny-self-hosted-runners --bundle gvx-desktop-$TAG.sigstore.json\`."
      - name: Upload rebuilt artifacts to existing release
        if: needs.prepare.outputs.publish_mode == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          # Merge rebuilt checksums into the existing release SHA256SUMS so the
          # manifest stays consistent with the refreshed archives.
          if gh release download "$TAG" --pattern SHA256SUMS --output prev_SHA256SUMS 2>/dev/null; then
            awk '
              NR == FNR { updated[$2] = $0; next }
              !($2 in updated) { print }
              END { for (k in updated) print updated[k] }
            ' meta/SHA256SUMS prev_SHA256SUMS | LC_ALL=C sort -k2,2 > merged_SHA256SUMS
            mv merged_SHA256SUMS meta/SHA256SUMS
            rm -f prev_SHA256SUMS
          else
            rm -f meta/SHA256SUMS
          fi
          rm -f meta/BUILD_INFO.txt
          gh release upload "$TAG" dist/* meta/* --clobber

  # Updates ironpark/homebrew-tap in an isolated job so TAP_GITHUB_TOKEN is
  # never exposed to build or attestation steps.
  homebrew:
    needs: [prepare, build-macos, publish]
    if: needs.prepare.outputs.publish_mode == 'create'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check Homebrew tap token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set; the release is published, but the Homebrew tap was not updated"
            exit 1
          fi
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          path: src
          persist-credentials: false
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ironpark/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
          fetch-depth: 1
      - name: Update the Homebrew tap
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.build-macos.outputs.sha256 }}
          SIGNING: ${{ needs.build-macos.outputs.signing }}
        run: |
          set -eu
          (cd src && ./release/cask.sh "$VERSION" "$SHA256" "$SIGNING") > gvx-desktop.rb
          mkdir -p tap/Casks
          cp gvx-desktop.rb tap/Casks/gvx-desktop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gvx-desktop.rb
          git diff --cached --quiet && { echo "the cask is unchanged"; exit 0; }
          git commit -m "Update gvx-desktop to $VERSION"
          git push

  # Packages, tests, attests, and optionally pushes the Chocolatey package
  # when CHOCO_PUBLISH is enabled.
  chocolatey:
    needs: [prepare, build-windows, publish]
    if: >-
      vars.CHOCO_PUBLISH == 'true' &&
      needs.prepare.outputs.publish_mode != 'dry-run'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      # Packaging scripts are read from the workflow ref so rebuilding an older
      # tag uses the current Chocolatey script.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack Chocolatey package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_AMD64: ${{ needs.build-windows.outputs.amd64 }}
          SHA256_ARM64: ${{ needs.build-windows.outputs.arm64 }}
        run: |
          set -eu
          mkdir -p out
          ./release/choco.sh "$VERSION" "$SHA256_AMD64" "$SHA256_ARM64" choco
          choco pack choco/gvx-desktop.nuspec --outputdirectory out
          ls -lh out/
      - name: Test installing Chocolatey package
        env:
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
        run: |
          set -eu
          choco install gvx-desktop --source ./out --yes --no-progress
          exe="$(cygpath "$ChocolateyInstall")/lib/gvx-desktop/tools/$APP_NAME.exe"
          [ -f "$exe" ] || { echo "::error::the package installed no program at $exe"; exit 1; }
          [ -f "$exe.gui" ] || { echo "::error::the program's shim is not marked as a GUI's"; exit 1; }
          choco uninstall gvx-desktop --yes --no-progress
      - name: Attest Chocolatey package
        id: attest_choco
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*.nupkg
      - name: Verify and upload Chocolatey package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUNDLE: ${{ steps.attest_choco.outputs.bundle-path }}
        run: |
          set -eu
          for nupkg in out/*.nupkg; do
            base="$(basename "$nupkg")"
            gh attestation verify "$nupkg" \
              --bundle "$BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
            (cd out && sha256sum -- "$base" > "$base.sha256")
            cp "$BUNDLE" "out/$base.sigstore.json"
            gh release upload "$TAG" "$nupkg" "out/$base.sha256" "out/$base.sigstore.json" --clobber
          done
      - name: Push to chocolatey.org
        if: needs.prepare.outputs.publish_mode == 'create'
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          set -eu
          if [ -z "$CHOCO_API_KEY" ]; then
            echo "::warning::CHOCO_API_KEY is not set; the package is in the release, not on chocolatey.org"
            exit 0
          fi
          choco push out/*.nupkg --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"
